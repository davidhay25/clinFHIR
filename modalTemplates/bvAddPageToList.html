<div>
    <div class="modal-header">

        <div class="row">
            <div class="col-md-8 col-sm-8">

                <h3>Add Page to list</h3>

            </div>

            <div class="col-md-4 col-sm-4">

                <div class="pull-right">
                    <button class="btn btn-link" ng-click="$dismiss()">Cancel</button>
                    <button class="btn btn-primary"
                            ng-show="input.description && input.name && input.author"
                            ng-click="save()">Add page</button>
                </div>
            </div>
        </div>

    </div>
    <div class="modal-body">


        <div class="row">
            <div class="col-md-2">
                Url
            </div>
            <div class="col-md-10">
                <input class="form-control" ng-model="input.pageUrl"/>
            </div>
        </div>
<br/>
        <div class="row">

            <div class="col-md-2">
                Description
            </div>
            <div class="col-md-10">
                <textarea class="form-control" ng-model="input.description"></textarea>
            </div>
        </div>
    </div>


</div>
