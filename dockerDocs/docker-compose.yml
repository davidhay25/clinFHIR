# docker-compose.yml for clinfhir
# start with   docker compose up -d

services:

  portal:
    image: davidhay25/portal
    container_name: portal
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /opt/certbot-webroot:/opt/certbot-webroot
    networks:
      - clinfhir-network
    depends_on:
      - forms
      - clinfhir
    mem_limit: 256m

  mongodb:
    image: mongo:8.2.7
    container_name: mongodbCS1
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    networks:
      - clinfhir-network
    volumes:
      - ./mongodb_data:/data/db
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.hello().isWritablePrimary"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s



  forms:
    image: davidhay25/forms
    container_name: forms
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGOHOSTNAME: mongodb
      ENVIRONMENT: clinfhir
      QURLPREFIX: http://clinfhir.com/questionnaire
      CONFIG_PATH: /app/secrets/nzhtsconfig.config
      NODE_OPTIONS: "--max-old-space-size=256"
    volumes:
      - /opt/clinfhir/secrets:/app/secrets
    networks:
      - clinfhir-network
    mem_limit: 512m

  clinfhir:
    image: davidhay25/cf
    container_name: clinfhir
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://mongodb:27017/clinfhir
      NODE_OPTIONS: "--max-old-space-size=384"
    networks:
      - clinfhir-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 1024m

  gb2:
    image: davidhay25/gb2
    container_name: gb2
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGOHOSTNAME: mongodb
      NODE_OPTIONS: "--max-old-space-size=256"
    networks:
      - clinfhir-network
    mem_limit: 768m

  hfs:
    image: ghcr.io/heliossoftware/hfs:latest
    container_name: hfs
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      HFS_STORAGE_BACKEND: mongodb
      HFS_MONGODB_URL: mongodb://mongodb:27017/?replicaSet=rs0
      HFS_MONGODB_DATABASE: hfs
      HFS_BASE_URL: https://clinfhir.com/fhir

      # --- Enable In-Memory / Embedded SQL-on-FHIR Engine ---
      HFS_ENABLE_SOF: "true"
      HFS_SOF_DEFAULT_FORMAT: "ndjson" # Options: ndjson, csv, parquet

      # Explicitly set all export sink paths to writable /tmp
      HFS_SOF_OUTPUT_DIR: "/tmp/sof-output"
      HFS_BULK_EXPORT_DIR: "/tmp/sof-output"
      HFS_BULK_OUTPUT_DIR: "/tmp/sof-output"
      HFS_EXPORT_DIR: "/tmp/sof-output"

    ports:
      - "3000:8080"
    networks:
      - clinfhir-network
    mem_limit: 512m

networks:
  clinfhir-network:
    driver: bridge